name: Desktop installers (macOS + Linux)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lite installer (${{ matrix.platform }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: macos, arch: arm64 }
          - { runner: macos-15-intel, platform: macos, arch: x64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
        env:
          ELECTRON_OVERRIDE_DIST_PATH: '${{ runner.temp }}/electron-not-used-by-node-tests'
      - name: Build native installer and portable archive
        run: node build/package-desktop.mjs
      - name: Check packaged Electron architecture
        shell: bash
        env:
          EXPECT_ARCH: '${{ matrix.arch }}'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          if [[ "${{ matrix.platform }}" == 'macos' ]]; then
            executable="dist/desktop-builds/Zhidian-darwin-$EXPECT_ARCH/Zhidian.app/Contents/MacOS/Zhidian"
          else
            executable="dist/desktop-builds/Zhidian-linux-$EXPECT_ARCH/Zhidian"
            dpkg-deb --contents "dist/installers/Zhidian-v$version-linux-$EXPECT_ARCH-lite.deb" | grep -F 'usr/share/applications/zhidian.desktop'
          fi
          test -x "$executable"
          EXPECT_ARCH="$EXPECT_ARCH" ELECTRON_RUN_AS_NODE=1 "$executable" -e 'if (process.arch !== process.env.EXPECT_ARCH) process.exit(2); console.log("Electron", process.versions.electron, process.platform, process.arch)'
      - name: Upload installers to verification gate
        uses: actions/upload-artifact@v4
        with:
          name: zhidian-installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  verify:
    name: Verify installers and SHA-256 checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zhidian-installer-*
          path: release-assets
          merge-multiple: true
      - name: Verify all four platform packages
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          for platform in macos linux; do
            for arch in x64 arm64; do
              test -s "SHA256SUMS-$platform-$arch.txt"
              sha256sum -c "SHA256SUMS-$platform-$arch.txt"
            done
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12

  publish:
    name: Publish installers to tagged GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zhidian-installer-*
          path: release-assets
          merge-multiple: true
      - name: Attach verified installers to version release
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          expected_tag="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "::error::Ref $tag does not match package.json version $expected_tag"
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "指点 ZhiDian $tag" --notes-file docs/releases/desktop-installers.md
          fi
          gh release upload "$tag" release-assets/* --clobber
          notes=$(mktemp)
          gh release view "$tag" --json body --jq .body > "$notes"
          if ! grep -Fq 'macOS/Linux Lite installers' "$notes"; then
            { cat "$notes"; printf '\n\n---\n\n'; cat docs/releases/desktop-installers.md; } > "$notes.new"
            gh release edit "$tag" --notes-file "$notes.new"
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, files: [.assets[].name]}'
